[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
# Heavy and local-only: needed to run the real model, not for tests or CI.
model = [
    "outlines>=1.3",
    "llguidance",
    "torch",
    "transformers",
    "accelerate",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
