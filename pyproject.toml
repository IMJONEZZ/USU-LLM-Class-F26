[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.26.0",
    "colorama>=0.4.6",
    "datasets>=3.0.0",
    "evaluate>=0.4.6",
    "modal>=1.5.5",
    "peft>=0.17.0",
    "rouge-score>=0.1.2",
    "scipy>=1.18.1",
    "spacy>=3.8.16",
    "textblob>=0.20.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=4,<5",
    "unsloth>=2025.11.1",
    "zenml[server]>=0.97.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
