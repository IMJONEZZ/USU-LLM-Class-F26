[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=10.2.0",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
