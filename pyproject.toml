[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "absl-py>=2.5.1",
    "datasets>=5.2.0",
    "dspy>=3.4.1",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "modal>=1.6.1",
    "nltk>=3.10.4",
    "prek>=0.5.5",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
extend-exclude = ["third_party"]

[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
testpaths = ["tests"]  # else pytest also collects the vendored *_test.py
pythonpath = ["third_party"]  # Google's code imports itself as instruction_following_eval
markers = ["slow: loads a real model or tokenizer"]
