[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "dspy[optuna]>=3.3,<3.4",
    "ipython>=9.18.1",
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.10.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80 --basetemp=.pytest_cache/tmp"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
