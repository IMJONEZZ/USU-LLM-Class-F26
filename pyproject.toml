[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.0.0",
    "colorama>=0.4.6",
    "datasets>=3.0",
    "distilabel[openai]>=1.5.3",
    "evaluate>=0.4.6",
    "huggingface-hub>=0.22",
    "ipywidgets>=8.1.9",
    "modal>=1.5.5",
    "openai>=1,<2",
    "outlines>=1.3.3",
    "scipy>=1.18.1",
    "sentence-transformers>=5.0.0",
    "spacy>=3.8.16",
    "textblob>=0.20.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=4,<5",
    "zenml[server]>=0.97.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
