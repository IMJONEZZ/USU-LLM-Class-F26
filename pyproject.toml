[project]
name = "usu-llm-class-f26"
version = "0.1.0"
description = "Repository for USU LLM Class DSAI-5810/6810, Fall 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "ipython>=9.17.1",
    "marimo>=0.25.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "transformers[torch]>=5.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=80"
