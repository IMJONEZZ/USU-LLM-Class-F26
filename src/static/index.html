<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment 9 — Constrained HTML</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Constrained HTML demo</h1>
      <p class="lede">
        Prompt the service; Qwen fills text while the grammar controls tags.
      </p>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="5" maxlength="4000">
Write a short page about Utah State University for new students.
      </textarea>
      <div class="actions">
        <button id="generate" type="button">Generate</button>
        <span id="status" aria-live="polite"></span>
      </div>
      <div class="results">
        <section class="pane">
          <h2>Rendered preview</h2>
          <iframe id="preview" title="Generated HTML preview" sandbox=""></iframe>
        </section>
        <section class="pane">
          <h2>HTML source</h2>
          <pre id="source"></pre>
        </section>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
